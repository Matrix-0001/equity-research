[project]
name = "equity-research"
version = "0.0.1"
description = "Local, point-in-time-correct equity research & portfolio analysis platform (research only, not advice)"
requires-python = ">=3.11"
dependencies = [
    "nasdaq-data-link>=1.0.4",  # Sharadar SF1/SEP/DAILY/TICKERS/ACTIONS/SP500
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",          # parquet snapshots
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",     # load API key from local .env (git-ignored)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# Optional: the bounded LLM bull/bear narrative. The core tool runs fully without it.
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
